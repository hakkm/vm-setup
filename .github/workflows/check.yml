name: Check VM setup
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  public-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-public.py
      - run: python3 tests/sudo-preflight.py
      - run: shellcheck install.sh uninstall.sh tests/smoke.sh
      - run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:latest dir /repo --no-banner --redact
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:20.04', 'ubuntu:24.04', 'debian:trixie', 'fedora:44', 'archlinux:latest', 'opensuse/tumbleweed:latest', 'alpine:latest']
    steps:
      - uses: actions/checkout@v7
      - name: Install, check editor and shell, rerun and verify backups
        run: docker run --rm -v "$PWD:/setup:ro" '${{ matrix.image }}' sh /setup/tests/smoke.sh
  focal-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Verify Ubuntu 20.04 fallback on native ARM64
        run: docker run --rm -v "$PWD:/setup:ro" ubuntu:20.04 sh /setup/tests/smoke.sh
